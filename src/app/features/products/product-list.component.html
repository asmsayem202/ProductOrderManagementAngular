<div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Product List</h2>
        <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700" (click)="createProduct()">
            <i class="fas fa-regular fa-circle-plus"></i> Add Product
        </button>
    </div>

    <div *ngIf="errorMessage" class="text-red-600 mb-4">{{ errorMessage }}</div>

    <table class="min-w-full bg-white border rounded shadow">
        <thead>
            <tr class="bg-gray-100 text-left">
                <th class="py-2 px-4 border-b">Name</th>
                <th class="py-2 px-4 border-b">Brand</th>
                <th class="py-2 px-4 border-b">Type</th>
                <th class="py-2 px-4 border-b text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let product of products" class="hover:bg-gray-50">
                <td class="py-2 px-4 border-b">{{ product.name }}</td>
                <td class="py-2 px-4 border-b">{{ product.brand }}</td>
                <td class="py-2 px-4 border-b">{{ product.type }}</td>
                <td class="py-2 px-4 border-b text-center">
                    <div class="flex justify-center gap-3">
                        <button title="Details" (click)="viewProductDetails(product.id!)"
                            class="text-blue-600 hover:text-blue-800">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button title="Edit" (click)="editProduct(product.id)"
                            class="text-green-600 hover:text-green-800">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button title="Delete" (click)="deleteProduct(product.id!)"
                            class="text-red-600 hover:text-red-800">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Confirm Delete Modal -->
<div *ngIf="showDeleteModal"
    class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 transition-opacity duration-200">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">Confirm Delete</h2>
        <p class="text-gray-700 mb-6">
            Are you sure you want to delete <strong>{{ selectedProduct?.name }}</strong>?
        </p>
        <div class="flex justify-end gap-2">
            <button class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600" (click)="closeModal()">
                Cancel
            </button>
            <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700" (click)="confirmDelete()">
                Delete
            </button>
        </div>
    </div>
</div>
