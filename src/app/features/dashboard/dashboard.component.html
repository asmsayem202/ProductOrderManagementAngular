<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <!-- Card 1 -->
    <div class="bg-white shadow rounded-xl p-6 flex items-center gap-4">
        <div class="bg-green-100 text-green-600 p-3 rounded-full">
            <i class="fas fa-box fa-lg"></i>
        </div>
        <div>
            <p class="text-sm text-gray-500">Total Products</p>
            <p class="text-xl font-semibold">128</p>
        </div>
    </div>

    <!-- Card 2 -->
    <div class="bg-white shadow rounded-xl p-6 flex items-center gap-4">
        <div class="bg-blue-100 text-blue-600 p-3 rounded-full">
            <i class="fas fa-shopping-cart fa-lg"></i>
        </div>
        <div>
            <p class="text-sm text-gray-500">Total Orders</p>
            <p class="text-xl font-semibold">54</p>
        </div>
    </div>

    <!-- Card 3 -->
    <div class="bg-white shadow rounded-xl p-6 flex items-center gap-4">
        <div class="bg-yellow-100 text-yellow-600 p-3 rounded-full">
            <i class="fas fa-users fa-lg"></i>
        </div>
        <div>
            <p class="text-sm text-gray-500">Customers</p>
            <p class="text-xl font-semibold">23</p>
        </div>
    </div>
</div>

<!-- Chart or List -->
<div class="bg-white shadow rounded-xl p-6">
    <h2 class="text-lg font-semibold mb-4">Recent Orders</h2>
    <table class="min-w-full table-auto text-sm">
        <thead>
            <tr class="bg-gray-100 text-left">
                <th class="p-2">Order ID</th>
                <th class="p-2">Customer</th>
                <th class="p-2">Date</th>
                <th class="p-2">Amount</th>
                <th class="p-2">Status</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let order of [1,2,3,4]" class="hover:bg-gray-50 border-b">
                <td class="p-2">#ORD{{ order }}23</td>
                <td class="p-2">John Doe</td>
                <td class="p-2">2025-07-20</td>
                <td class="p-2">$150.00</td>
                <td class="p-2">
                    <span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs">Completed</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
