<div class="space-y-6">
    <!-- Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
        <div class="bg-white shadow-md rounded-2xl p-5 flex items-center gap-4">
            <i class="fas fa-box text-3xl text-blue-600"></i>
            <div>
                <h4 class="text-gray-600">Total Products</h4>
                <p class="text-xl font-semibold">{{ totalProducts }}</p>
            </div>
        </div>
        <div class="bg-white shadow-md rounded-2xl p-5 flex items-center gap-4">
            <i class="fas fa-shopping-cart text-3xl text-green-600"></i>
            <div>
                <h4 class="text-gray-600">Total Orders</h4>
                <p class="text-xl font-semibold">{{ totalOrders }}</p>
            </div>
        </div>
        <div class="bg-white shadow-md rounded-2xl p-5 flex items-center gap-4">
            <i class="fas fa-boxes text-3xl text-purple-600"></i>
            <div>
                <h4 class="text-gray-600">Total Order Items</h4>
                <p class="text-xl font-semibold">{{ totalOrderItems }}</p>
            </div>
        </div>
    </div>

    <!-- Recent Orders Table -->
    <div class="bg-white shadow-md rounded-2xl p-6">
        <h2 class="text-lg font-semibold mb-4">Recent Orders</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full text-sm text-left text-gray-600">
                <thead class="bg-gray-100 text-xs uppercase text-gray-500">
                    <tr>
                        <th class="px-4 py-3">Customer</th>
                        <th class="px-4 py-3">Email</th>
                        <th class="px-4 py-3">Total Items</th>
                        <th class="px-4 py-3">Order Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let order of recentOrders" class="border-b hover:bg-gray-50">
                        <td class="px-4 py-3 font-medium">{{ order.customerName }}</td>
                        <td class="px-4 py-3">{{ order.customerEmail }}</td>
                        <td class="px-4 py-3">{{ order.items.length }}</td>
                        <td class="px-4 py-3">{{ order.orderDate| date }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
