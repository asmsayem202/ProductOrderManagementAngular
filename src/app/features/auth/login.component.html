<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-100 via-white to-purple-100 px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Sign in to your account</h2>

        <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" class="space-y-5">
            <div>
                <label for="email" class="block text-gray-700 font-semibold mb-1">Email</label>
                <div class="relative">
                    <input id="email" formControlName="email" type="email"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none"
                        placeholder="you@example.com" />
                    <i class="fas fa-envelope absolute right-4 top-3.5 text-gray-400"></i>
                </div>
                <div class="text-red-500 text-sm mt-1"
                    *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                    Valid email is required
                </div>
            </div>

            <div class="mb-4 relative">
                <label for="password" class="block text-gray-700 font-semibold mb-1">
                    Password
                </label>

                <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10"
                    placeholder="Enter your password" />

                <!-- Toggle Button -->
                <button type="button" (click)="togglePasswordVisibility()"
                    class="absolute right-4 top-9 text-gray-600 focus:outline-none">
                    <i *ngIf="!showPassword" class="fas fa-eye text-gray-400 hover:text-gray-700"></i>
                    <i *ngIf="showPassword" class="fas fa-eye-slash text-gray-400 hover:text-gray-700"></i>

                </button>

                <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                    class="text-red-500 text-sm mt-1">
                    Password is required
                </div>
            </div>


            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 hover:cursor-pointer text-white font-semibold py-2 rounded-lg shadow-md transition duration-300"
                [disabled]="loginForm.invalid">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Don’t have an account?
            <a class="text-blue-600 hover:underline hover:cursor-pointer font-medium" routerLink="/register">Register
                here</a>
        </div>
    </div>
</div>
